services:
  db:
    image: postgres:17-alpine
    container_name: movie-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: movie
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: movie_dev_password
    ports:
      # 5432 on the host is deliberately avoided: other projects on this
      # machine already publish Postgres there and on 5433/5434. The container
      # still listens on 5432 internally.
      - "5435:5432"
    volumes:
      - movie-db-data:/var/lib/postgresql/data
    healthcheck:
      # Steps like `dotnet ef database update` must run once Postgres actually
      # accepts connections, not the moment the container reports "running".
      test: ["CMD-SHELL", "pg_isready -U movie -d movie"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development turns on the Scalar browser and the logging email sender.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      # Reaches Postgres over the compose network, so the host port mapping is
      # irrelevant here.
      ConnectionStrings__Database: "Host=db;Port=5432;Database=movie;Username=movie;Password=movie_dev_password"

      # A local-only key. Production reads this from its own environment; see
      # the startup check in Movie.Infrastructure.DependencyInjection.
      Jwt__SigningKey: "compose-development-signing-key-not-for-production"
    ports:
      - "5080:8080"

volumes:
  movie-db-data:
